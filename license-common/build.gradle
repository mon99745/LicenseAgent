plugins {
    id 'java'
}

bootJar {
    enabled = false
    archiveClassifier = ''
}

jar {
    enabled = true
}

dependencies {
    // Transitive Dependency
    implementation 'org.bitcoinj:bitcoinj-core:0.15.10'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.apache.commons:commons-lang3:3.13.0'
}

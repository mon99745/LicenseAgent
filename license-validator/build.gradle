plugins {
    id 'java'
}

bootJar {
    enabled = true
    archiveClassifier = ''
}

jar {
    enabled = true
    exclude('**/*Properties.class')
    exclude('**/*Application.class')
    exclude('**/controller/**')
}

dependencies {
    implementation fileTree(dir: '../lib', includes: [
            "jsonwebtoken-*.jar"
    ])
    implementation project(':license-common')
}

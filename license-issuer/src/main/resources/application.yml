### 서버 관리
server:
  ### 내장 WAS 관리
  port: 8080

### Spring 관리
spring:
  config:
    name: ISSUER
    import: application-common.yml

  datasource:
### h2 DB(default)
    driver-class-name: org.h2.Driver
###    다중 프로세스 접근 (File Mode, default)
    url: jdbc:h2:file:./db/h2/h2db;AUTO_SERVER=true
###    단일 프로세스 접근 (In-Memory Mode)
#    url: jdbc:h2:mem:testdb
### MariaDB
#    driver-class-name: org.mariadb.jdbc.Driver
#    url: jdbc:mariadb://localhost:3307/demo?rewriteBatchedStatements=true
    username: sa
    password:
  h2:
#    console:
#      enabled: true
#      settings:
#        web-allow-others: true
#      path: /h2-console

  ### JPA 관리
  jpa:
    hibernate.ddl-auto: update
    show-sql: true


license:
  licenseName: "demo"
  licensePrefix: ""
  licenseSuffix: ".lic"
  save-path: "./lic/"

